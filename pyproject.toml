[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adamus"
# Not a release number: releases are git tags, and a session records the commit it ran from.
version = "0"
description = "Music that follows the focus detected in EEG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rastislav Lipták" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "brainflow==5.24.0",
    "fastapi==0.162.0",
    "librosa==1.0.0",
    "numpy==2.3.5",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "sounddevice==0.5.6",  # plays the music of a session on the chosen output
    "soundfile==0.14.0",
    "tinytag==2.3.2",  # the title and the picture a song file carries
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",  # the test client of the API
    "hypothesis==6.170.15",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "coverage==7.17.3",  # the mutation tool asks it which tests run which line
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",  # the tests in processes side by side
    "ruff==0.17.4",
    "types-PyYAML==6.0.12.20261111",  # the types of the YAML library, for pyright
]

[project.scripts]
adamus = "adamus.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adamus*"]  # src/ui is the app, built by Xcode

[tool.setuptools.package-data]
"adamus.server" = ["head_model.json"]  # head: scripts/export_head_model.py

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests run in processes side by side, as many as the computer has room for (conftest.py).
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -n auto"
markers = [
    "fast: every test that is neither slow nor window (conftest.py marks them)",
    "slow: takes minutes",
    "window: uses the window with the mouse and the keyboard",
]
pythonpath = ["."]
filterwarnings = ["error"]

# What scripts/mutation_testing.py measures, to know which tests run a line.
[tool.coverage.run]
source = ["adamus"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "."]  # adamus, and the tests' own package of helpers

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "B", "UP", "SIM", "PTH", "RET", "ARG", "C90", "PLR", "PLW", "BLE",
    "ANN",  # every parameter and result of the program has its type
]
ignore = [
    "PLR2004",  # which numbers need a name is decided by tests/coding_rules (PLAIN_NUMBERS)
    "ANN401",  # Any where a value comes as parsed (YAML, JSON) or from a library without types
]

[tool.ruff.lint.per-file-ignores]
# Tests name things like the formulas (E), keep unused fixture arguments, compare
# against literal expected values, and put a constant first when it is what the
# value computed is checked against (SIM300 takes that for a yoda condition).
"tests/**" = ["N803", "ARG", "PLR", "PLW", "E731", "BLE", "SIM300", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40
max-branches = 10

[tool.pyright]
# The checker of the editor (Pylance), strict over the program and its tests, so that a test's
# stand-in must offer what the device it replaces does. What a library without types gives
# is taken as it comes; that every parameter of the program is typed, ruff checks (ANN).
include = ["src/adamus", "scripts", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false  # the tests' fixtures; ruff asks the program for every type
