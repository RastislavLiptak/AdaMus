# AdaMus configuration. Paths are relative to the folder the program is started in.

board:                        # the headset; recordings of datasets are played at its rate
  name: Muse 2
  id: 38                      # BrainFlow board id
  serial_number: ""           # "" = the first one found
protocol:
  - [REST, 60]
  - [FOCUS, 60]
  - [REST, 60]
  - [FOCUS, 60]
  - [REST, 60]
  - [FOCUS, 60]
  - [REST, 60]
  - [FOCUS, 60]
  - [FREE, 0]                 # 0 = until the session is stopped
timeouts:
  stream_s: 5
poll_s: 0.05
